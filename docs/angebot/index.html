<style>
:root{
  --paper:#FEFCFA; --canvas:#F6F3EF; --card:#FFFFFF; --ink:#1B1A18; --ink2:#4A4742; --body:#6E6A64; --muted:#9A958D; --faint:#B8B3AB;
  --rule:#DAD5CD; --hair:#ECE9E4; --hair2:#F5F2EE; --soft:#FAF8F5; --accent:#F2660F; --accent-2:#D9540A; --tint:#FFF1E8; --tint-bd:#F6E1D0;
  --ok:#2E7D5B; --warn:#C24A3A; --on-accent:#FFFFFF; --dark:#1B1A18; --dark-text:#FEFCFA; --dark-muted:#CFCAC3; --dark-line:#3A3733;
  --hg:"Hanken Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --pm:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ease-out:cubic-bezier(0.23,1,0.32,1);
  --r-lg:20px; --r-md:14px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#151412; --canvas:#100F0E; --card:#1C1B19; --ink:#F5F2EE; --ink2:#D9D4CC; --body:#B3ADA4; --muted:#8A857D; --faint:#5F5A53;
    --rule:#3A3733; --hair:#2A2825; --hair2:#232120; --soft:#1F1E1B; --tint:#2A1D14; --tint-bd:#4A2E1B; --on-accent:#FFFFFF;
    --dark:#000000; --dark-text:#F5F2EE; --dark-muted:#A39E96; --dark-line:#2A2825;
  }
}
:root[data-theme="dark"]{
  --paper:#151412; --canvas:#100F0E; --card:#1C1B19; --ink:#F5F2EE; --ink2:#D9D4CC; --body:#B3ADA4; --muted:#8A857D; --faint:#5F5A53;
  --rule:#3A3733; --hair:#2A2825; --hair2:#232120; --soft:#1F1E1B; --tint:#2A1D14; --tint-bd:#4A2E1B; --on-accent:#FFFFFF;
  --dark:#000000; --dark-text:#F5F2EE; --dark-muted:#A39E96; --dark-line:#2A2825;
}
*{box-sizing:border-box}
html,body{background:var(--canvas)}
body{margin:0;color:var(--ink);font-family:var(--hg);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;padding-block:0 124px}
.wrap{max-width:1120px;margin:0 auto;padding-inline:20px}
@media (min-width:768px){.wrap{padding-inline:32px}}
h1,h2,h3{margin:0;color:var(--ink);text-wrap:balance}
h1{font-size:clamp(38px,6vw,68px);font-weight:900;line-height:.95;letter-spacing:-0.025em;text-transform:uppercase}
h1 span{color:var(--faint)}
h2{font-size:clamp(22px,2.6vw,30px);font-weight:800;letter-spacing:-0.015em;line-height:1.15}
h3{font-size:17px;font-weight:800;letter-spacing:-0.01em;line-height:1.3}
p{margin:0;color:var(--ink2)}
.eyebrow{font-family:var(--pm);font-size:12px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:12px}
.mono{font-family:var(--pm);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.lead{font-size:18px;line-height:1.55;max-width:60ch;color:var(--ink2)}

.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:22px;border-bottom:1px solid var(--hair);flex-wrap:wrap}
.mark{display:flex;align-items:center;gap:10px;color:var(--ink);font-weight:900;font-size:22px;letter-spacing:-0.02em}
.mark i{width:12px;height:12px;border-radius:50%;background:var(--accent);display:inline-block}
.seg{display:inline-flex;background:var(--soft);border-radius:12px;padding:4px;gap:4px;box-shadow:inset 0 0 0 1px var(--hair)}
.seg button{appearance:none;border:0;font:inherit;font-family:var(--pm);font-weight:700;font-size:13px;line-height:20px;padding:6px 14px;border-radius:9px;background:transparent;color:var(--muted);cursor:pointer;transition:background-color .15s ease,color .15s ease}
.seg button.on{background:var(--accent);color:#fff}
@media (hover:hover) and (pointer:fine){.seg button:not(.on):hover{color:var(--ink)}}
.seg button:focus-visible,.btn:focus-visible,.row-check:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.hero{padding-block:44px 26px}
@media (min-width:768px){.hero{padding-block:60px 32px}}
.hero .lead{margin-top:18px}
.refs{display:flex;flex-wrap:wrap;gap:6px 26px;margin-top:22px;font-family:var(--pm);font-size:12.5px;color:var(--muted)}
.refs b{color:var(--ink2);font-weight:600}
.bandline{margin-top:20px;padding-top:16px;border-top:1px solid var(--hair);font-size:14px;color:var(--body);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.bandline b{font-family:var(--pm);font-weight:700;color:var(--ink)}

section.block{margin-top:44px}
.block-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 24px;margin-bottom:16px}
.block-head p{max-width:64ch;font-size:15px;color:var(--body)}

/* dark lever block */
.share{background:var(--dark);color:var(--dark-text);border-radius:var(--r-lg);padding:26px 22px;display:grid;gap:26px}
@media (min-width:900px){.share{grid-template-columns:1fr 1fr;padding:32px;gap:34px;align-items:start}}
.share h3{color:var(--dark-text)}
.share .eyebrow{color:#FFB27A}
.share p{color:var(--dark-muted);font-size:14px;line-height:1.5}
.lever + .lever{margin-top:24px}
.lever-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.lever-head .k{font-size:14.5px;font-weight:800;color:var(--dark-text)}
.lever-head .v{font-family:var(--pm);font-size:20px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.dseg{display:grid;grid-template-columns:repeat(6,1fr);background:rgba(255,255,255,.08);border-radius:12px;padding:4px;gap:4px;margin-top:10px}
.dseg button{appearance:none;border:0;font:inherit;font-family:var(--pm);font-weight:700;font-size:13px;line-height:20px;padding:8px 2px;border-radius:9px;background:transparent;color:var(--dark-muted);cursor:pointer;transition:background-color .15s ease,color .15s ease}
.dseg button.on{background:var(--accent);color:#fff}
@media (hover:hover) and (pointer:fine){.dseg button:not(.on):hover{color:var(--dark-text)}}
.lever-foot{display:flex;justify-content:space-between;gap:12px;margin-top:8px;font-size:12px;color:var(--dark-muted)}
.share p.scope{margin-top:12px;font-size:12.5px;line-height:1.5;color:var(--dark-muted);border-left:2px solid var(--accent);padding-left:12px}

  var state={lang:"en",shares:20,months:4.0,pay:"phase",start:"2026-10-01",later:{}};

  function detect(){ try{var l=(navigator.language||"en").slice(0,2).toLowerCase(); if(l==="de"||l==="tr")return l;}catch(e){} return "en"; }
  function load(){
    state.lang=detect();
    try{
      var raw=localStorage.getItem("svQuote3"); if(!raw)return;
      var s=JSON.parse(raw);
      if(T[s.lang])state.lang=s.lang;
      if(SHARE_STEPS.indexOf(s.shares)>-1)state.shares=s.shares;
      if(MONTH_STEPS.indexOf(s.months)>-1)state.months=s.months;
      if(s.pay)state.pay=s.pay;
      if(s.start)state.start=s.start;
      if(s.later&&typeof s.later==="object")state.later=s.later;
    }catch(e){}
  }
  function save(){ try{localStorage.setItem("svQuote3",JSON.stringify(state));}catch(e){} }
  function L(){ return T[state.lang]; }
  function f(s,v){ return String(s).replace(/\{(\w+)\}/g,function(_,k){return v&&v[k]!==undefined?v[k]:"";}); }

  function chf(n){
    var neg=n<-0.004; n=Math.abs(n);
    var s=n.toFixed(2), dot=s.indexOf("."), int=s.slice(0,dot), dec=s.slice(dot+1);
    var out="",c=0;
    for(var i=int.length-1;i>=0;i--){ out=int[i]+out; c++; if(c%3===0&&i>0)out="'"+out; }
    return (neg?"−":"")+out+"."+dec;
  }
  function rate(m){ return BAND_RATE - RATE_STEP*((m-FAST_MONTHS)/0.5); }
  function pensum(m){ return HOURS/(m*WEEKS_PER_MONTH*FULL_WEEK)*100; }
  function hoursWeek(m){ return HOURS/(m*WEEKS_PER_MONTH); }
  var MIN_M=MONTH_STEPS[MONTH_STEPS.length-1], MAX_M=MONTH_STEPS[0];
  var BAND_MAX = HOURS*rate(MAX_M) + ONCE_TOTAL + MONTHLY_TOTAL*MAX_M;
  var BAND_MIN = HOURS*rate(MIN_M)*(1-SHARE_STEPS[SHARE_STEPS.length-1]/100)
                 + ONCE_TOTAL + MONTHLY_TOTAL*MIN_M;

  function calc(){
    var r=rate(state.months);
    var std=HOURS*STD_RATE;
    var ded=HOURS*PROFIT;
    var budget=HOURS*BUDGET_OFF;
    var timePerH=BAND_RATE-r;
    var time=HOURS*timePerH;
    var labour=HOURS*r;
    var eqAmt=labour*state.shares/100;
    var net=labour-eqAmt;
    var effective=net/HOURS;
    var recur=MONTHLY_TOTAL*state.months;
    var fixed=ONCE_TOTAL+recur;
    return {r:r,std:std,ded:ded,budget:budget,timePerH:timePerH,time:time,labour:labour,
            eqPct:state.shares,eqAmt:eqAmt,net:net,effective:effective,
            off:(1-effective/STD_RATE)*100,
            recur:recur,once:ONCE_TOTAL,fixed:fixed,total:net+fixed};
  }

  function pd(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
  function addD(d,n){var x=new Date(d.getTime());x.setDate(x.getDate()+n);return x;}
  function addM(d,n){var x=new Date(d.getTime());x.setMonth(x.getMonth()+n);return x;}
  function fdate(d){return ("0"+d.getDate()).slice(-2)+"."+("0"+(d.getMonth()+1)).slice(-2)+"."+d.getFullYear();}

  function split(total,n){
    var cents=Math.round(total*100), each=Math.round(cents/n), out=[], acc=0;
    for(var i=0;i<n-1;i++){out.push(each/100);acc+=each;}
    out.push((cents-acc)/100); return out;
  }
  function nM(){return Math.ceil(state.months);}
  function nB(){return Math.ceil((state.months*4.345)/2);}

  function schedule(c){
    var t=L(),start=pd(state.start),rows=[];
    if(state.pay==="phase"){
      var cents=Math.round(c.net*100),acc=0,parts=[];
      for(var i=0;i<PHASE_HOURS.length-1;i++){
        var v=Math.round(cents*PHASE_HOURS[i]/HOURS); parts.push(v); acc+=v;
      }
      parts.push(cents-acc);
      var cum=0;
      for(var k=0;k<PHASE_HOURS.length;k++){
        cum+=PHASE_HOURS[k];
        rows.push({d:addD(start,Math.round((cum/HOURS)*state.months*30.4375)),
                   w:f(t.rPhase,{i:k+1,n:t.phN[k]})+(k===0?t.rPhaseFix:""),
                   a:parts[k]/100+(k===0?c.fixed:0)});
      }
    }else if(state.pay==="monthly"){
      var n=nM(),p=split(c.total,n);
      for(var m=0;m<n;m++)rows.push({d:addM(start,m),w:f(t.rMonth,{i:m+1,n:n}),a:p[m]});
    }else{
      var nb=nB(),pb=split(c.total,nb);
      for(var b=0;b<nb;b++)rows.push({d:addD(start,b*14),w:f(t.rCycle,{i:b+1,n:nb}),a:pb[b]});
    }
    return rows;
  }

  function laterList(){
    var t=L(),ids=["seo","infl"],out=[];
    for(var i=0;i<ids.length;i++){
      var h=LATER_HOURS[ids[i]],full=h*COST_RATE;
      out.push({id:ids[i],n:t.ltN[i],d:t.ltD[i],hours:h,full:full,net:full*(100-state.shares)/100});
    }
    return out;
  }

  function el(id){return document.getElementById(id);}
  function setText(id,v){var e=el(id); if(e)e.textContent=v;}

  function buildSeg(host,vals,cur,fmt,onPick){
    host.innerHTML="";
    vals.forEach(function(v){
      var b=document.createElement("button");
      b.type="button"; b.textContent=fmt(v);
      b.className=(v===cur?"on":"");
      b.setAttribute("aria-pressed",v===cur?"true":"false");
      b.addEventListener("click",function(){onPick(v);});
      host.appendChild(b);
    });
  }

  function buildLangs(){
    var host=el("langs"); host.innerHTML="";
    [["en","EN"],["de","DE"],["tr","TR"]].forEach(function(p){
      var b=document.createElement("button");
      b.type="button"; b.textContent=p[1];
      b.className=(state.lang===p[0]?"on":"");
      b.setAttribute("aria-pressed",state.lang===p[0]?"true":"false");
      b.addEventListener("click",function(){state.lang=p[0];save();buildAll();});
      host.appendChild(b);
    });
  }

  function buildPay(){
    var t=L(),host=el("payGrid"); host.innerHTML="";
    ["phase","monthly","biweekly"].forEach(function(id,i){
      var b=document.createElement("button");
      b.type="button"; b.className="opt"+(state.pay===id?" selected":"");
      b.innerHTML='<span class="who" data-meta="'+id+'"></span><span class="nm"></span><span class="rate" data-each="'+id+'"></span>';
      b.querySelector(".nm").textContent=t.payN[i];
      b.addEventListener("click",function(){state.pay=id;save();buildPay();render();});
      host.appendChild(b);
    });
  }

  function buildLater(){
    var host=el("later"); host.innerHTML="";
    laterList().forEach(function(l){
      var id="later-"+l.id, on=!!state.later[l.id];
      var d=document.createElement("div");
      d.className="lcard"+(on?" on":"");
      d.innerHTML='<input class="row-check" type="checkbox" id="'+id+'"><div><label class="t" for="'+id+'"></label>'+
                  '<div class="d"></div><div class="p" data-price="'+l.id+'"></div></div>';
      d.querySelector(".t").textContent=l.n;
      d.querySelector(".d").textContent=l.d;
      var cb=d.querySelector("input"); cb.checked=on;
      cb.addEventListener("change",function(){state.later[l.id]=cb.checked;save();buildLater();render();});
      host.appendChild(d);
    });
  }

  function renderStatic(){
    var t=L();
    document.documentElement.lang=state.lang;
    el("t-h1").innerHTML="";
    el("t-h1").appendChild(document.createTextNode(t.h1a+" "));
    var sp=document.createElement("span"); sp.textContent=t.h1b; el("t-h1").appendChild(sp);
    ["eyebrow","lede","refL","issL","valid","bandL","bandNote","s1","s1h","sharesL","sharesA","sharesB",
     "monthsL","monthsA","monthsB","totalL","s2","s2h","thLine","thBasis","s3","s3h","thPhase","thHours",
     "thStart","thEnd","thValue","phSum","phLegend","payTerm","thPay","scopeNote","s4","s4h","startL","thDue","thFor","s5","s5h","s6","fxAfter","barL","totalL2"
    ].forEach(function(k){ setText("t-"+k,t[k]); });
    setText("t-fixedS",f(t.fixedS,{n:FIXED_MONTHLY.length+FIXED_ONCE.length}));
    setText("t-tagRateL",t.tagRate); setText("t-tagUpL",t.tagUp); setText("t-tagEqL",t.tagEq);
    setText("t-meterL",t.meterL);
    setText("t-f1",t.f1); setText("t-f3",t.f3);
    setText("t-f2",f(t.f2,{lo:"CHF "+chf(BAND_MIN),hi:"CHF "+chf(BAND_MAX)}));

    var n=el("notes"); n.innerHTML="";
    t.whyT.forEach(function(title,i){
      var d=document.createElement("div"); d.className="note";
      var h=document.createElement("h3"); h.textContent=title;
      var p=document.createElement("p"); p.textContent=t.whyB[i];
      d.appendChild(h); d.appendChild(p); n.appendChild(d);
    });
  }

  function render(){
    var t=L(),c=calc();

    setText("sharesVal",state.shares+"%");
    setText("monthsVal",state.months.toFixed(1)+" "+t.mo);
    setText("totalFig",chf(c.total));
    setText("barFig","CHF "+chf(c.total));
    setText("barCfg",state.shares+"% · "+state.months.toFixed(1)+" "+t.mo);
    setText("tagRate","CHF "+c.effective.toFixed(2)+"/"+t.hr);
    setText("tagUp",c.timePerH>0?"−CHF "+c.timePerH.toFixed(2):t.none);
    setText("tagEq",c.eqPct?"−"+c.eqPct+"%":t.none);
    setText("totalNote",f(t.totalNote,{h:HOURS,r:c.r.toFixed(2),m:state.months.toFixed(1),f:chf(c.fixed)}));
    setText("effFig",c.effective.toFixed(2));
    setText("effPer","/ "+t.hr);
    el("effNote").innerHTML=f(t.effNote,{s:STD_RATE.toFixed(2),e:c.effective.toFixed(2),o:c.off.toFixed(0)});
    setText("intensity",f(t.intensity,{h:HOURS,w:(state.months*WEEKS_PER_MONTH).toFixed(0),
      x:hoursWeek(state.months).toFixed(2).replace(/\.00$/,""),p:pensum(state.months).toFixed(0)}));
    el("meterFill").style.width=Math.max(2,Math.min(100,(c.total-BAND_MIN)/(BAND_MAX-BAND_MIN)*100))+"%";
    setText("bandFig","CHF "+chf(BAND_MIN)+" \u2013 "+chf(BAND_MAX));
    setText("meterLo",chf(BAND_MIN)); setText("meterHi",chf(BAND_MAX));

    var rows=[
      ["","",t.lStd,f(t.lStdB,{h:HOURS,r:STD_RATE.toFixed(2)}),c.std],
      ["","−",t.lDed,f(t.lDedB,{x:PROFIT.toFixed(2),h:HOURS}),c.ded],
      ["","−",t.lBudget,f(t.lBudgetB,{x:BUDGET_OFF.toFixed(2),h:HOURS}),c.budget],
      ["","−",t.lUp,c.timePerH>0?f(t.lUpB,{x:c.timePerH.toFixed(2),h:HOURS}):t.lUpN,c.time],
      ["sub","=",t.lSub,f(t.lSubB,{h:HOURS,r:c.r.toFixed(2)}),c.labour],
      ["","−",t.lEq,c.eqPct?f(t.lEqB,{p:c.eqPct}):t.lEqN,c.eqAmt],
      ["","+",t.lFix,f(t.lFixB,{n:FIXED_MONTHLY.length+FIXED_ONCE.length,m:state.months.toFixed(1)}),c.fixed]
    ];
    var h="";
    rows.forEach(function(r){
      h+="<tr"+(r[0]?" class='"+r[0]+"'":"")+"><td class='op'>"+r[1]+"</td>"+
         "<td class='name'><b>"+r[2]+"</b></td>"+
         "<td class='basis'>"+r[3]+"</td><td class='num'><span class='c'>"+chf(r[4])+"</span></td></tr>";
    });
    el("ledger").innerHTML=h;
    setText("ledgerTotal",chf(c.total));

    var ph="",cumH=0,pst=pd(state.start),span=state.months*30.4375;
    PHASE_HOURS.forEach(function(hr,i){
      var d0=addD(pst,Math.round((cumH/HOURS)*span));
      cumH+=hr;
      var d1=addD(pst,Math.round((cumH/HOURS)*span));
      ph+="<tr><td class='name'><b>"+(i+1)+". "+t.phN[i]+"</b><small>"+t.phD[i]+"</small></td>"+
          "<td class='num'><span class='c'>"+fdate(d0)+"</span></td>"+
          "<td class='num'><span class='c'>"+fdate(d1)+"</span></td>"+
          "<td class='num'><span class='c'>"+hr+"</span></td>"+
          "<td class='num'><span class='c'>"+chf(c.net*hr/HOURS)+"</span></td></tr>";
    });
    el("phases").innerHTML=ph;
    setText("phHours",HOURS); setText("phTotal",chf(c.net));

    var counts={phase:PHASE_HOURS.length,monthly:nM(),biweekly:nB()};
    Array.prototype.forEach.call(document.querySelectorAll("[data-meta]"),function(e){
      var n=counts[e.getAttribute("data-meta")];
      e.textContent=n+" "+(n===1?t.payment:t.payments);
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-each]"),function(e){
      var n=counts[e.getAttribute("data-each")];
      e.textContent="⌀ CHF "+chf(c.total/n);
    });

    var rws=schedule(c),sh="",sum=0;
    rws.forEach(function(r,i){
      sum+=r.a;
      sh+="<tr><td class='mono muted'>"+(i+1)+"</td><td class='num'><span class='c'>"+fdate(r.d)+"</span></td>"+
          "<td class='num'><span class='c'>"+fdate(addD(r.d,PAY_DAYS))+"</span></td>"+
          "<td class='name'><small style='margin-top:0'>"+r.w+"</small></td>"+
          "<td class='num'><span class='c'>"+chf(r.a)+"</span></td></tr>";
    });
    el("schedule").innerHTML=sh;
    setText("schedCount",rws.length+" "+(rws.length===1?t.payment:t.payments));
    setText("schedTotal",chf(sum));
    setText("endNote",f(t.deliverBy,{d:fdate(addD(pd(state.start),Math.round(state.months*30.4375)))}));

    var lsum=0,count=0;
    laterList().forEach(function(l){
      var node=document.querySelector("[data-price='"+l.id+"']");
      if(node){
        node.innerHTML="CHF "+chf(l.net)+(state.shares?"<span class='was'>CHF "+chf(l.full)+"</span>":"")+
          "<span class='bs'>"+f(t.ltBasis,{h:l.hours,r:COST_RATE.toFixed(2)})+
          (state.shares?f(t.ltLess,{p:state.shares}):"")+"</span>";
      }
      if(state.later[l.id]){lsum+=l.net;count++;}
    });
    setText("laterCount",count===0?t.ltNone:(count===1?t.ltOne:f(t.ltMany,{n:count})));
    setText("laterTotal","CHF "+chf(lsum));

    setText("formula",HOURS+" "+t.hr+" × CHF "+c.r.toFixed(2)+" × "+
      ((100-c.eqPct)/100).toFixed(2)+" + CHF "+chf(c.fixed)+"  =  CHF "+chf(c.total));

    var ft="";
    ft+="<tr class='grp'><td>"+t.fxMonthly+"</td><td class='num'>"+t.fxPerMonth+
        "</td><td class='num'>"+f(t.fxTimes,{m:state.months.toFixed(1)})+"</td></tr>";
    FIXED_MONTHLY.forEach(function(v,i){
      ft+="<tr><td>"+t.fixedM[i]+"</td><td class='num soft'>"+chf(v)+
          "</td><td class='num'>"+chf(v*state.months)+"</td></tr>";
    });
    ft+="<tr class='sub2'><td>"+t.fxSubM+"</td><td class='num soft'>"+chf(MONTHLY_TOTAL)+
        "</td><td class='num'>"+chf(c.recur)+"</td></tr>";
    ft+="<tr class='grp'><td>"+t.fxOnce+"</td><td></td><td></td></tr>";
    FIXED_ONCE.forEach(function(v,i){
      ft+="<tr><td>"+t.fixedO[i]+"</td><td class='num soft'>&mdash;</td><td class='num'>"+chf(v)+"</td></tr>";
    });
    ft+="<tr class='sub2'><td>"+t.fxSubO+"</td><td></td><td class='num'>"+chf(c.once)+"</td></tr>";
    ft+="<tr><td>"+t.fixedSum+"</td><td></td><td class='num'>"+chf(c.fixed)+"</td></tr>";
    el("fixedTable").innerHTML=ft;
  }

  function fmtShare(v){ return v+"%"; }
  function fmtMonth(v){ return v.toFixed(1); }
  function pickShare(v){ state.shares=v; save(); drawShares(); buildLater(); render(); }
  function pickMonth(v){ state.months=v; save(); drawMonths(); render(); }
  function drawShares(){ buildSeg(el("segShares"),SHARE_STEPS,state.shares,fmtShare,pickShare); }
  function drawMonths(){ buildSeg(el("segMonths"),MONTH_STEPS,state.months,fmtMonth,pickMonth); }

  function buildAll(){
    renderStatic(); drawShares(); drawMonths(); buildPay(); buildLater(); render();
  }

  load();
  buildLangs();
  var sd=el("startDate"); sd.value=state.start;
  sd.addEventListener("change",function(){if(sd.value){state.start=sd.value;save();render();}});
  buildAll();
})();
</script>

</body>
