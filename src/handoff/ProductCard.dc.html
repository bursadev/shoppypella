<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div onClick="{{ open }}" style="display:flex;flex-direction:column;width:100%;height:100%;background:var(--card,#fff);border:1px solid var(--card-bd,#ECE9E4);border-radius:var(--r-md,14px);overflow:hidden;cursor:pointer;backdrop-filter:var(--blur,none);-webkit-backdrop-filter:var(--blur,none);transition:box-shadow .15s,border-color .15s,transform .15s;font-family:var(--font,'Hanken Grotesk'),sans-serif" style-hover="box-shadow:0 8px 24px rgba(27,26,24,.10);border-color:#E0DCD5;transform:translateY(-2px)">
  <div style="position:relative;width:100%;aspect-ratio:1/1;background:var(--card2,#FAF8F5);display:flex;align-items:center;justify-content:center;padding:10px">
    <sc-if value="{{ p.badge }}" hint-placeholder-val="{{ true }}">
      <span style="position:absolute;top:10px;left:10px;background:var(--accent-bg,var(--pri,#F2660F));color:#fff;font-size:11px;font-weight:700;letter-spacing:.02em;padding:4px 9px;border-radius:7px;z-index:2">{{ p.badge }}</span>
    </sc-if>
    <span style="position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;font-size:15px;color:#9A958D;box-shadow:0 1px 3px rgba(0,0,0,.08);z-index:2"><svg viewBox="0 0 24 24" style="width:1em;height:1em;display:inline-block;vertical-align:-0.14em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><use href="#ic-heart"/></svg></span>
    <sc-if value="{{ p.img }}" hint-placeholder-val="{{ false }}"><img src="{{ p.img }}" alt="{{ p.name }}" style="position:absolute;inset:10px;width:calc(100% - 20px);height:calc(100% - 20px);object-fit:contain;mix-blend-mode:multiply"/></sc-if>
  </div>
  <div style="display:flex;flex-direction:column;gap:5px;padding:11px 12px 13px;flex:1">
    <div style="font-size:11.5px;color:#9A958D;font-weight:600;letter-spacing:.01em">{{ p.seller }}</div>
    <div style="font-size:13.5px;line-height:1.32;color:var(--ink,#1B1A18);font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px">{{ p.name }}</div>
    <div style="display:flex;align-items:center;gap:5px;font-size:12px;color:#6E6A64">
      <span style="color:var(--pri,#F2660F)">★</span><span style="font-weight:700;color:var(--ink,#1B1A18)">{{ p.rating }}</span><span style="color:#B8B3AB">({{ p.reviews }})</span>
    </div>
    <div style="display:flex;align-items:baseline;gap:8px;margin-top:auto;padding-top:4px">
      <span style="font-size:16px;font-weight:800;color:{{ p.priceColor }}">CHF {{ p.price }}</span>
      <sc-if value="{{ p.hasOld }}" hint-placeholder-val="{{ true }}"><span style="font-size:12.5px;color:#B8B3AB;text-decoration:line-through">{{ p.oldPrice }}</span></sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:220,&quot;height&quot;:320},&quot;p&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;any&quot;,&quot;default&quot;:{&quot;name&quot;:&quot;Mikrofiber Bez 8’li Set&quot;,&quot;seller&quot;:&quot;Pella Home&quot;,&quot;price&quot;:&quot;14.90&quot;,&quot;oldPrice&quot;:&quot;CHF 18.90&quot;,&quot;hasOld&quot;:true,&quot;rating&quot;:&quot;4.9&quot;,&quot;reviews&quot;:340,&quot;badge&quot;:&quot;Çok Satanlar&quot;,&quot;img&quot;:&quot;assets/img06.jpeg&quot;}},&quot;open&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}"></script>
</body>
</html>
