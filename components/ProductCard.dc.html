<!DOCTYPE html>
<html><head><meta charset="utf-8"></head>
<body>
<!-- Product grid tile. Props: `p` (a product from the catalog), `open` (click handler). -->
<x-dc>
<div onclick="{{ open }}" style="background:#fff;border:1px solid #ECE9E4;border-radius:var(--r-md,14px);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;height:100%">

  <!-- Definite height, not aspect-ratio: as a flex item the tile's min-height:auto
       would otherwise be driven by these portrait photos and stretch the card. -->
  <div style="position:relative;flex:none;height:172px;background:#FAF8F5;display:flex;align-items:center;justify-content:center;padding:10px;border-bottom:1px solid #F0EDE8">
    <sc-if value="{{ p.badge }}">
      <span style="position:absolute;top:9px;left:9px;z-index:1;background:var(--accent-bg,var(--pri,#F2660F));color:#fff;font-size:11px;font-weight:800;padding:4px 9px;border-radius:7px">{{ p.badge }}</span>
    </sc-if>
    <span style="position:absolute;top:9px;right:9px;z-index:1;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;color:#9A958D">
      <svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><use href="#ic-heart"></use></svg>
    </span>
    <img src="{{ p.img }}" alt="{{ p.name }}" loading="lazy" style="max-width:100%;max-height:100%;object-fit:contain">
  </div>

  <div style="padding:11px 12px 13px;display:flex;flex-direction:column;flex:1">
    <div style="font-size:11.5px;font-weight:700;color:#9A958D;margin-bottom:4px">{{ p.seller }}</div>
    <div style="font-size:13.5px;font-weight:700;line-height:1.35;color:var(--ink,#1B1A18)">{{ p.name }}</div>
    <div style="display:flex;align-items:center;gap:5px;margin-top:7px;font-size:12px;color:#9A958D">
      <span style="color:var(--pri,#F2660F);font-weight:800">★ {{ p.rating }}</span>
      <span>({{ p.reviews }})</span>
    </div>
    <div style="margin-top:auto;padding-top:10px;display:flex;align-items:baseline;gap:7px;flex-wrap:wrap">
      <span style="font-size:16.5px;font-weight:900;color:var(--ink,#1B1A18)">CHF {{ p.price }}</span>
      <sc-if value="{{ p.hasOld }}">
        <span style="font-size:12.5px;color:#B8B3AB;text-decoration:line-through">{{ p.oldPrice }}</span>
      </sc-if>
    </div>
    <div style="font-size:11.5px;font-weight:700;color:#2E7D5B;margin-top:5px">Ücretsiz kargo</div>
  </div>

</div>
</x-dc>
</body></html>
